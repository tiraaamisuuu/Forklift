name: CI

on:
  push:
  pull_request:

jobs:
  headless:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - name: Configure headless build
        run: cmake -S . -B build -DCHESS_BUILD_GUI=OFF -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Core and UCI tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Windows UCI clock regression
        if: runner.os == 'Windows'
        run: python tests/uci_clock_regression.py build/Release/chess-engine-uci.exe
      - name: Match and research tooling tests
        run: |
          python tests/compare_engines_tests.py
          python tests/champion_gate_tests.py
          python tests/calibrate_rating_tests.py
          python tests/calibration_dashboard_tests.py
          python tests/benchmark_threads_tests.py
          python scripts/generate_research_figures.py --check

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Address and undefined behaviour sanitizers
        run: scripts/run_sanitizers.sh

  web-gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: web/requirements.txt
      - name: Build engine
        run: |
          cmake -S . -B build -DCHESS_BUILD_GUI=OFF -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Install web bridge dependency
        run: python -m pip install -r web/requirements.txt
      - name: Validate web interface
        run: |
          node --check web/app.js
          python tests/web_api_smoke.py --engine ./build/chess-engine-uci

  windows-desktop:
    # SFML 2.6.2's official VC17 archive targets the Visual Studio 2022 ABI.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Download and verify SFML 2.6.2
        shell: pwsh
        run: ./scripts/install_sfml_windows.ps1 -Root (Join-Path $env:RUNNER_TEMP 'sfml') -EnvironmentFile $env:GITHUB_ENV
      - name: Configure desktop build
        shell: pwsh
        run: cmake -S . -B build-gui -G "Visual Studio 17 2022" -A x64 -DCHESS_BUILD_GUI=ON -DBUILD_TESTING=ON "-DSFML_DIR=$env:SFML_DIR"
      - name: Build and test
        shell: pwsh
        run: |
          cmake --build build-gui --config Release --parallel
          ctest --test-dir build-gui -C Release --output-on-failure
          cmake --build build-gui --config Release --target package
      - name: Verify desktop package
        shell: pwsh
        run: |
          $package = Get-ChildItem build-gui -Filter 'Forklift-*.zip' | Select-Object -First 1
          if (-not $package) { throw 'CPack did not create the Windows GUI ZIP archive.' }
          $listing = tar -tf $package.FullName
          foreach ($entry in @('bin/Forklift.exe', 'bin/sfml-graphics-2.dll', 'bin/openal32.dll')) {
            if (-not ($listing -match [regex]::Escape($entry))) { throw "Missing packaged runtime: $entry" }
          }
